name: Web to APK Build
on:
  workflow_dispatch:
    inputs:
      web_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      icon_url:
        required: false
        default: ""
        type: string
      tag:
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Placeholder web2apk
        run: |
          echo "Web URL: ${{ inputs.web_url }}"
          echo "App: ${{ inputs.app_name }}"
          echo "Tag: ${{ inputs.tag }}"
          echo "Workflow web2apk terpasang. Pipeline penuh mengikuti bot."
          
