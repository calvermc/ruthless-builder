name: Flutter Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      tag:
        required: true
        type: string
      build_type:
        required: false
        default: "release"
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.zip" --output project.zip || \
          curl -fsSL -L -o project.zip \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ZIP_URL"
      - name: Extract
        run: mkdir -p project && unzip -q project.zip -d project
      - name: Find Flutter root
        id: root
        run: |
          if [ -f project/pubspec.yaml ]; then
            echo "dir=project" >> $GITHUB_OUTPUT
          else
            FOUND=$(find project -name pubspec.yaml -type f | head -1 | xargs dirname)
            echo "dir=$FOUND" >> $GITHUB_OUTPUT
          fi
      - name: Flutter pub get
        working-directory: ${{ steps.root.outputs.dir }}
        run: flutter pub get
      - name: Build APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: |
            ${{ steps.root.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 2
          
